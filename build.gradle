// mcef-forge-1.20.1 —— 让 WebDisplays 这类依赖 JCEF API 的 mod 在
// Android + MC 1.20.1 Forge 上运行。
//
// ── 架构（决定了这里的依赖清单）────────────────────────────────────────
//
//   MC JVM（纯 OpenJDK，加载不到 android.*）
//     └── com.cinemamod.mcef.*   ← 本项目（零 android 依赖）
//           └── McefNative (JNI) → libmcef.so
//                 └── IPC 127.0.0.1:39090
//                       └── 启动器 .cefhost 进程（ART + Cefrium + libcef）
//
// 所以本项目不依赖 Cefrium SDK：Cefrium 只跑在启动器进程里，
// MC 侧只跟 libmcef.so 打交道。
//
// ── 依赖从哪来 ───────────────────────────────────────────────────────
//
// 早先这棵树依赖一个被 .gitignore 排除的 libs/ 目录，干净 clone 直接构建失败。
// 现在改用 ForgeGradle 6 从 Maven 解析 MC/Forge/LWJGL，libs/ 只作为本地覆盖入口。
//
// ── Java 版本 ────────────────────────────────────────────────────────
//
// 输出必须是 Java 17 字节码（MC 1.20.1 的 class 是 v61）。
// 用 JDK 17 或更高版本运行 Gradle 都可以，这里只钉输出级别。

plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = '2.2.0-1.20.1-android'
group = 'com.cinemamod'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // 可选本地覆盖：把额外的 jar 丢进 libs/ 即可，不存在也不会报错。
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 不要用 --release：它会把 API 视图锁到目标版本，遇到高版本 class 直接报
    // "class file has wrong version"。-source/-target 只约束输出。
    options.release = null
    options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-unchecked' << '-Xlint:-options'
}

// so 的两种打包方式（对应 McefNative.load() 的两级回退）：
//
//   A. 启动器预置：so 打进启动器 APK 的 lib/arm64-v8a/，
//      System.loadLibrary("mcef") 直接命中。这是常规路径，jar 里不含 so。
//   B. 独立分发：把 natives/arm64-v8a/libmcef.so 一起塞进 mod jar，
//      加载时解压到 java.io.tmpdir 再 System.load。
//      本仓库 1.20.1 分支的 test-builds/ 就是这种形态。
//
// 注意 B 的解压目录必须是可执行目录：/data/local/tmp 在多数 Android
// 设备上挂 noexec，dlopen 会失败。
jar {
    archiveBaseName = 'mcef-forge'
    manifest {
        attributes([
                'Specification-Title'    : 'mcef-forge',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
        ])
    }
}

// 打包 so 的开关：-PwithNative（默认关，走 A 路径）。
// 打开时把 native/mcef_bridge 编出来的 so 放进 jar。
if (project.hasProperty('withNative')) {
    def soPath = file("${projectDir}/natives/arm64-v8a/libmcef.so")
    if (!soPath.exists()) {
        throw new GradleException("withNative 已开启但缺文件: ${soPath}")
    }
    jar {
        from(projectDir) {
            include 'natives/**'
        }
    }
}

// ForgeGradle 6 的 jar 任务已包含 reobf，产物可直接投入 mods/。
